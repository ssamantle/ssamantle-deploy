services:
  backend:
    image: ssamantle-server
    build:
      context: backend
      dockerfile: Dockerfile
    container_name: ssamantle-backend
    ports:
      - 44345:8000
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - DATABASE_NAME=./data/semantle.db
    depends_on:
      - redis
    restart: unless-stopped
    volumes:
      - ./volume/server:/app/data
  frontend:
    image: ssamantle-web-client
    build:
      context: frontend
      dockerfile: Dockerfile
      args:
        API_BASE_URL: http://localhost:44345
    container_name: ssamantle-frontend
    depends_on:
      - backend
    ports:
      - 80:80
    restart: unless-stopped
  redis:
    image: redis:latest
    container_name: redis
    ports:
      - 6379:6379
    volumes:
      - ./volume/redis:/data
    command: [ "redis-server", "--appendonly", "yes" ]
