services:
  web-client:
    container_name: ssamantle-web-client
    image: ssamantle-web-client:latest
    build:
      context: submodules/web-client
      dockerfile: Dockerfile
      args:
        API_BASE_URL: http://localhost:8000
    restart: unless-stopped
    depends_on: [game-server]
    ports: [80:80]

  game-server:
    container_name: ssamantle-game-server
    image: ssamantle-game-server:latest
    build:
      context: submodules/game-server
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on: [redis, postgres]
    ports: [8000:8000]
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - DATABASE_URL=postgresql://semantle:semantle@postgres:5432/semantle

  postgres:
    container_name: ssamantle-postgres
    image: postgres:16
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U semantle"]
      interval: 5s
      timeout: 5s
      retries: 5
    ports: [5432:5432]
    environment:
      - POSTGRES_DB=semantle
      - POSTGRES_USER=semantle
      - POSTGRES_PASSWORD=semantle

  redis:
    container_name: ssamantle-redis
    image: redis:latest
    command: ["redis-server", "--appendonly", "yes"]
    ports: [6379:6379]
